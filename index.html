<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USC 28 Schedule</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-elements">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <main class="app-container">
        <header class="app-header">
            <h1><i class="fa-solid fa-calendar-check"></i> FCAI USC 28 Schedule</h1>
        </header>

        <section class="selection-panel glass-card">
            <div class="step-container" id="step-dept">
                <label>1. Select Departments</label>
                <div class="courses-grid" id="departments-container">
                    <!-- Checkboxes populated by JS -->
                </div>
            </div>

            <div class="step-container hidden" id="step-group">
                <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 1rem;">
                    <label>2. Select Groups</label>
                    <button id="toggle-search-btn" class="view-btn" style="background: rgba(88, 166, 255, 0.15); color: var(--accent-color); border: 1px solid rgba(88, 166, 255, 0.4);"><i class="fa-solid fa-magnifying-glass"></i> Find Your Group by ID</button>
                </div>
                <div class="courses-grid" id="groups-container">
                    <!-- Checkboxes populated by JS -->
                </div>
                
                <div id="id-search-container" class="search-container hidden">
                    <label for="student-id-input" class="search-label">Enter Student ID to find your group</label>
                    <div class="search-input-group">
                        <input type="text" id="student-id-input" class="custom-input" placeholder="e.g. 2432002">
                        <button id="search-btn" class="primary-btn">Find Group</button>
                    </div>
                    <div id="search-result" class="search-result"></div>
                </div>
            </div>

            <div class="step-container hidden" id="step-courses">
                <label>3. Select Courses <span class="subtitle">(only courses for your department and group are
                        shown)</span></label>
                <div class="courses-grid" id="courses-container">
                    <!-- Checkboxes populated by JS -->
                </div>
            </div>

            <button id="generate-btn" class="primary-btn hidden" disabled>Generate Schedule</button>
        </section>

        <section id="schedule-view" class="schedule-panel glass-card hidden">
            <div class="schedule-header">
                <h2>Your Timetable</h2>
                <div class="view-toggles">
                    <button class="view-btn active" data-view="list"><i class="fa-solid fa-list"></i> List</button>
                    <!-- Expandable to Grid view later if needed -->
                </div>
            </div>

            <div id="timetable-container" class="timetable list-view">
                <!-- Timetable generated by JS -->
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
    <script src="script.js"></script>
</body>

</html>
