<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Schedule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-elements">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <main class="app-container">
        <header class="app-header">
            <h1><i class="fa-solid fa-calendar-check"></i> My Schedule</h1>
            <p>Select your department, group, and courses to generate your personalized timetable.</p>
        </header>

        <section class="selection-panel glass-card">
            <div class="step-container" id="step-dept">
                <label for="department-select">1. Select Department</label>
                <select id="department-select" class="custom-select">
                    <option value="" disabled selected>Choose Department</option>
                    <!-- Populated by JS -->
                </select>
            </div>

            <div class="step-container hidden" id="step-group">
                <label for="group-select">2. Select Group</label>
                <select id="group-select" class="custom-select">
                    <option value="" disabled selected>Choose Group</option>
                    <!-- Populated by JS -->
                </select>
            </div>

            <div class="step-container hidden" id="step-courses">
                <label>3. Select Courses <span class="subtitle">(only courses for your department are
                        shown)</span></label>
                <div class="courses-grid" id="courses-container">
                    <!-- Checkboxes populated by JS -->
                </div>
            </div>

            <button id="generate-btn" class="primary-btn hidden" disabled>Generate Schedule</button>
        </section>

        <section id="schedule-view" class="schedule-panel glass-card hidden">
            <div class="schedule-header">
                <h2>Your Timetable</h2>
                <div class="view-toggles">
                    <button class="view-btn active" data-view="list"><i class="fa-solid fa-list"></i> List</button>
                    <!-- Expandable to Grid view later if needed -->
                </div>
            </div>

            <div id="timetable-container" class="timetable list-view">
                <!-- Timetable generated by JS -->
            </div>
        </section>
    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
